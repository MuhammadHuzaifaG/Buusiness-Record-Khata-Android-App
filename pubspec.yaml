name: digital_khata
description: A secure offline-first e-commerce Digital Khata app with Google Sheets sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_sign_in: ^6.2.1
  http: ^1.2.0
  intl: ^0.20.3
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.0
  connectivity_plus: ^6.0.3
  pdf: ^3.10.4
  printing: ^5.11.0
  screenshot: ^3.0.0
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Gulzar
      fonts:
        - asset: assets/fonts/Gulzar-Regular.ttf